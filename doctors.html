  <header class="page-head">
    <div class="container">
      <p class="breadcrumb"><a href="../index.html">Home</a> / Doctors</p>
      <h1>Find Your <span class="text-grad">Doctor</span></h1>
      <p>Browse 200+ verified specialists. Filter by specialty and country, compare ratings, and book in seconds.</p>
    </div>
  </header>

  <section class="section" style="padding-top:48px">
    <div class="container">

      <div class="filter-bar reveal">
        <div class="search-field">
          <span id="searchIcon"></span>
          <input type="text" id="docSearch" placeholder="Search by doctor name..." />
        </div>
        <select id="specFilter"><option value="">All Specialties</option></select>
        <select id="countryFilter"><option value="">All Countries</option></select>
        <select id="sortBy">
          <option value="rating">Sort: Top Rated</option>
          <option value="exp">Sort: Most Experienced</option>
          <option value="fee">Sort: Lowest Fee</option>
        </select>
      </div>

      <p id="resultCount" style="color:var(--muted);font-weight:600;margin-bottom:20px"></p>

      <div class="grid g-3" id="docGrid"></div>
    </div>
  </section>


  <div id="site-footer"></div>
  
  <div class="modal-overlay" id="bookingModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Book Appointment</h3>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="bookingBody"></div>
    </div>
  </div>


  <script src=" js/data.js"></script>
  <script src=" js/main.js"></script>
  <script src=" js/components.js"></script>
  <script src=" js/booking.js"></script>
  <script>
    mountChrome();
    document.getElementById('searchIcon').innerHTML = ICONS.search;

    // ==========================================
    // 1. توليد 200 دكتور حقيقيين وضمان عدم تداخل الملفات الأخرى
    // ==========================================
    function expandDoctorsTo200() {
      if (!window.DB) window.DB = {};
      if (!DB.doctors) DB.doctors = [];
      
      const backupSpecialties = ["Cardiology", "Dermatology", "Neurology", "Pediatrics", "Orthopedics", "Ophthalmology", "General Surgery"];
      const specialtiesList = (DB.specialties && DB.specialties.length > 0) ? DB.specialties : backupSpecialties;

      DB.doctors.forEach(d => {
        if (d.isBooked === undefined) d.isBooked = false;
      });

      const extraLocations = [
        { city: "Abu Dhabi", country: "UAE" }, { city: "Dubai", country: "UAE" },
        { city: "Riyadh", country: "Saudi Arabia" }, { city: "Jeddah", country: "Saudi Arabia" },
        { city: "New York", country: "USA" }, { city: "Chicago", country: "USA" },
        { city: "London", country: "UK" }, { city: "Manchester", country: "UK" },
        { city: "Cairo", country: "Egypt" }, { city: "Alexandria", country: "Egypt" },
        { city: "Berlin", country: "Germany" }, { city: "Munich", country: "Germany" },
        { city: "Monaco", country: "France" }, { city: "Paris", country: "France" },
        { city: "Milano", country: "Italy" }, { city: "Napoli", country: "Italy" },
        { city: "Osaka", country: "Japan" }, { city: "Tokyo", country: "Japan" },
        { city: "Shanghai", country: "China" }, { city: "Seoul", country: "Korea Republic" },
      ];
      
      const firstNames = ["Fatima", "Omar", "Aisha", "Emily", "James", "Yusuf", "Sarah", "Ali", "John", "Khaled", "Mary", "Zainab", "Robert", "Layla", "Daniel"];
      const lastNames = ["Zahra", "Khalil", "Noor", "Stone", "Carter", "Rahman", "Smith", "Mansoor", "Davis", "Hassan", "Taylor", "Wright", "Fawzy", "King"];
      const avatarClasses = ["av-red", "av-violet", "av-cyan", "av-amber", "av-green", "av-primary"];

      let currentId = DB.doctors.length + 1;
      
      while (DB.doctors.length < 200) {
        const spec = specialtiesList[Math.floor(Math.random() * specialtiesList.length)];
        const loc = extraLocations[Math.floor(Math.random() * extraLocations.length)];
        const fName = firstNames[Math.floor(Math.random() * firstNames.length)];
        const lName = lastNames[Math.floor(Math.random() * lastNames.length)];
        const av = avatarClasses[Math.floor(Math.random() * avatarClasses.length)];

        DB.doctors.push({
          id: currentId++,
          name: `Dr. ${fName} ${lName}`,
          specialty: spec,
          city: loc.city,
          country: loc.country,
          exp: Math.floor(Math.random() * 15) + 5, 
          fee: Math.floor(Math.random() * 60) + 30, 
          rating: (Math.random() * (5.0 - 4.5) + 4.5).toFixed(1),
          reviews: Math.floor(Math.random() * 300) + 100,
          av: av,
          bio: `Specialist in ${spec}.`,
          isBooked: false
        });
      }
    }

    expandDoctorsTo200();

    /* Populate filter selects */
    const specF = document.getElementById('specFilter');
    const countryF = document.getElementById('countryFilter');
    
    specF.innerHTML = '<option value="">All Specialties</option>';
    countryF.innerHTML = '<option value="">All Countries</option>';
    
    const allUniqueSpecs = [...new Set(DB.doctors.map(d => d.specialty))];
    allUniqueSpecs.forEach(s => specF.innerHTML += `<option value="${s}">${s}</option>`);
    
    const allUniqueCountries = [...new Set(DB.doctors.map(d => d.country))];
    allUniqueCountries.forEach(c => countryF.innerHTML += `<option value="${c}">${c}</option>`);

    // ==========================================
    // 2. كارت الدكتور المطور مع ميزة التعطيل (Disabled)
    // ==========================================
    function doctorCard(d) {
      const stars = ICONS.star;
      
      const statusBadge = d.isBooked 
        ? `<span class="badge" style="background-color: #ffe6e6; color: #dc3545; font-weight: 600;">Unavailable</span>`
        : `<span class="badge badge-green">Available</span>`;
        
      const bookingButton = d.isBooked
        ? `<button class="btn btn-sm" disabled style="background-color: #6c757d; color: white; cursor: not-allowed; border: none; opacity: 0.7;">Booked</button>`
        : `<button class="btn btn-primary btn-sm" onclick="openBooking(${d.id})">Book Now</button>`;

      return `
      <div class="card entity-card reveal">
        <div class="ec-banner" style="background:var(--grad-soft)"></div>
        <div class="avatar avatar-2 ${d.av || ''} ec-avatar" style="font-size:1.4rem">${initials(d.name)}</div>
        <div class="ec-body">
          <h3>${d.name}</h3>
          <p class="ec-spec">${d.specialty}</p>
          <div class="ec-meta">
            <span>${ICONS.pin} ${d.city}, ${d.country}</span>
            <span>${ICONS.clock} ${d.exp} yrs exp</span>
            <li><a href="Pharmacy/pharmacy.html" target="_blank">⚕</a></li>
          </div>
          <div class="ec-meta">
            <span class="badge badge-blue">$${d.fee} / visit</span>
            ${statusBadge}
          </div>
          <div class="ec-foot">
            <span class="rating">${stars} ${d.rating} <span style="color:var(--muted);font-weight:500">(${d.reviews})</span></span>
            ${bookingButton}
          </div>
        </div>
      </div>`;
    }

    // =========================================================
    // 3. إعادة كتابة دالة التأكيد الأصلية (Function Overriding)
    // =========================================================
    if (typeof confirmBooking === 'function') {
      const originalConfirmBooking = confirmBooking; 
      
      confirmBooking = function(doc) {
        if (!bookingState.date || !bookingState.time) {
          originalConfirmBooking(doc); 
          return;
        }
        doc.isBooked = true;
        originalConfirmBooking(doc);
        render();
      };
    }

    function render() {
      const q = document.getElementById('docSearch').value.toLowerCase();
      const spec = specF.value, country = countryF.value, sort = document.getElementById('sortBy').value;
      let list = DB.doctors.filter(d =>
        d.name.toLowerCase().includes(q) &&
        (!spec || d.specialty === spec) &&
        (!country || d.country === country));
      list.sort((a, b) => sort === 'rating' ? b.rating - a.rating
        : sort === 'exp' ? b.exp - a.exp : a.fee - b.fee);

      const grid = document.getElementById('docGrid');
      document.getElementById('resultCount').textContent = `${list.length} doctor${list.length !== 1 ? 's' : ''} found`;
      if (!list.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">${ICONS.search}<h3>No doctors found</h3><p>Try adjusting your search or filters.</p></div>`;
        return;
      }
      grid.innerHTML = list.map(doctorCard).join('');
      if (typeof initReveal === 'function') initReveal();
    }

    ['docSearch','specFilter','countryFilter','sortBy'].forEach(id =>
      document.getElementById(id).addEventListener('input', render));
      
    render();
  </script>
</body>
